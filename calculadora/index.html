<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Calculadora</title><style>body{background:#050507;color:white;font-family:system-ui;display:grid;place-items:center;height:100vh;margin:0}.c{width:280px}input{width:100%;padding:20px;background:#111;color:#fff;border:1px solid #333;border-radius:12px;font-size:28px;text-align:right}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}button{padding:18px;border:0;border-radius:12px;font-size:18px}</style><div class="c"><input id="d" readonly><div class="g" id="g"></div></div><script>let d=document.querySelector('#d'),g=document.querySelector('#g');['C','(',')','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','⌫','='].forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{if(x==='C')d.value='';else if(x==='⌫')d.value=d.value.slice(0,-1);else if(x==='='){try{d.value=Function('return '+d.value)()}catch{d.value='Erro'}}else d.value+=x};g.append(b)})</script>
