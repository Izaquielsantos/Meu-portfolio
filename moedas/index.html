<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Conversor</title><style>body{background:#050507;color:#fff;font-family:system-ui;display:grid;place-items:center;height:100vh;margin:0}.box{background:#0d0d12;padding:30px;border:1px solid #222;border-radius:20px;width:min(360px,85vw)}input,select{width:100%;padding:12px;margin:6px 0 14px;box-sizing:border-box;background:#15151c;color:#fff;border:1px solid #333;border-radius:10px}</style><div class="box"><h1>Conversor</h1><input id="v" type="number" value="100"><select id="from"><option>BRL</option><option>USD</option><option>EUR</option></select><select id="to"><option>USD</option><option>BRL</option><option>EUR</option></select><h2 id="r"></h2><small>Taxas demonstrativas para projeto de portfólio.</small></div><script>let rates={BRL:1,USD:5.4,EUR:6.3},v=document.querySelector('#v'),f=document.querySelector('#from'),t=document.querySelector('#to'),r=document.querySelector('#r');function c(){let x=(+v.value||0)*rates[f.value]/rates[t.value];r.textContent=x.toLocaleString('pt-BR',{maximumFractionDigits:2})+' '+t.value} [v,f,t].forEach(e=>e.addEventListener('input',c));c()</script>
