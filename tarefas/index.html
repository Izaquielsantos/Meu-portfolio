<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Tarefas</title><style>body{background:#050507;color:#fff;font-family:system-ui;max-width:600px;margin:70px auto;padding:20px}input,button{padding:12px;border-radius:10px;border:1px solid #333}input{width:70%;background:#111;color:#fff}li{margin:10px 0;background:#111;padding:12px;border-radius:10px;display:flex;justify-content:space-between}.done{text-decoration:line-through;opacity:.5}</style><h1>Minhas tarefas</h1><input id="i" placeholder="Nova tarefa"><button onclick="add()">Adicionar</button><ul id="l"></ul><script>let a=JSON.parse(localStorage.tasks||'[]'),l=document.querySelector('#l'),i=document.querySelector('#i');function save(){localStorage.tasks=JSON.stringify(a);render()}function render(){l.innerHTML='';a.forEach((x,n)=>{let e=document.createElement('li');e.className=x.d?'done':'';e.innerHTML=`<span>${x.t}</span><span><button onclick="done(${n})">✓</button> <button onclick="del(${n})">×</button></span>`;l.append(e)})}function add(){if(i.value.trim()){a.push({t:i.value.trim(),d:false});i.value='';save()}}function done(n){a[n].d=!a[n].d;save()}function del(n){a.splice(n,1);save()}render()</script>
